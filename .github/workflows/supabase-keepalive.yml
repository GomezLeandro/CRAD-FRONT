# Evita que Supabase (plan free) pause el proyecto por 7 días sin actividad.
# Hace una consulta mínima a la tabla pública `servicios` todos los días.
#
# La URL va fija acá (es pública, ya viaja en el front) para no depender de un
# secret que pueda apuntar a otro proyecto.
#
# Requiere este secret en GitHub (Settings → Secrets and variables → Actions):
#   - SUPABASE_ANON_KEY  → mismo valor que VITE_SUPABASE_ANON_KEY (clave pública sb_publishable_…)
#
# Si la consulta no devuelve filas, el job falla y GitHub manda un mail.
name: Supabase keep-alive

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base
        env:
          SUPABASE_URL: https://snadabbytrthkuxcmtkw.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Proyecto: $SUPABASE_URL"
          status=$(curl --silent --show-error --output body.json --write-out '%{http_code}' \
            "$SUPABASE_URL/rest/v1/servicios?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "HTTP $status"
          cat body.json; echo
          [ "$status" = "200" ] && grep -q '"id"' body.json
