# Evita que Supabase (plan free) pause el proyecto por 7 días sin actividad.
# Hace una consulta mínima a la tabla pública `servicios` cada 3 días.
#
# Requiere estos secrets en GitHub (Settings → Secrets and variables → Actions):
#   - SUPABASE_URL       → mismo valor que VITE_SUPABASE_URL
#   - SUPABASE_ANON_KEY  → mismo valor que VITE_SUPABASE_ANON_KEY (clave pública)
name: Supabase keep-alive

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/servicios?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
